server:
  port: 8761

spring:
  application:
    name: discovery-service

# Actuator - expose health endpoint cho Docker healthcheck
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

eureka:
  instance:
    hostname: discovery-service
  client:
    # Vì đây là Server, ta không cần nó tự đăng ký vào danh sách của chính nó
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Tắt chế độ bảo vệ (Self Preservation) khi chạy ở môi trường Dev/Local để Eureka xóa các service chết nhanh hơn
    enable-self-preservation: false