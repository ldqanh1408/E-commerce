name: Backend Microservices CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: 
          - discovery-service
          - api-gateway
          - user-service
          - product-service
          - order-service
          - payment-service
          - cart-service

    steps:
    # 1. Lấy code từ Repo về
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Cài đặt Oracle Java 25
    - name: Set up Oracle JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'        # Phiên bản Java
        distribution: 'oracle'    # Phân phối Oracle OpenJDK
        cache: maven              # Cache lại thư viện Maven để build nhanh hơn

    # 3. Build & Test từng service
    - name: Build with Maven
      run: |
        cd ${{ matrix.service }}
        mvn clean package -DskipTests

  # --- (PHẦN NÂNG CAO: ĐẨY LÊN DOCKER HUB) ---
  docker-push:
    name: Docker Push - ${{ matrix.service }}
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: 
          - discovery-service
          - api-gateway
          - user-service
          - product-service
          - order-service
          - payment-service
          - cart-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cài đặt Java 25 cho Job này luôn
      - name: Set up Oracle JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: maven

      # Build file .jar trước
      - name: Build Jar
        run: |
          cd ${{ matrix.service }}
          mvn clean package -DskipTests

      # Login vào Docker Hub (Cần cấu hình Secret trên Github trước)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Docker Image và Push lên Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          # Đặt tên image: username/service-name:latest
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/axon-${{ matrix.service }}:latest
