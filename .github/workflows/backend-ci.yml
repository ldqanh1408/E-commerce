name: Backend Microservices CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: 
          - discovery-service
          - api-gateway
          - user-service
          - product-service
          - order-service
          - payment-service
          - cart-service

    steps:
    # 1. Lấy code từ Repo về
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Cài đặt Java 17 (Để tương thích tốt với Lombok & Spring Boot 3)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 3. Build Core Libraries (Quan trọng: Phải build trước các service khác)
    - name: Build Core Libraries
      run: |
        echo "Building core-common..."
        if [ -d "core-common" ]; then
          mvn -f core-common/pom.xml clean install -DskipTests
        else
          echo "core-common not found, skipping..."
        fi
        
        echo "Building core-security..."
        if [ -d "core-security" ]; then
          mvn -f core-security/pom.xml clean install -DskipTests
        else
          echo "core-security not found, skipping..."
        fi

        echo "Building product-service-grpc..."
        if [ -d "product-service-grpc" ]; then
          mvn -f product-service-grpc/pom.xml clean install -DskipTests
        else
          echo "product-service-grpc not found, skipping..."
        fi

        echo "Building product-api..."
        if [ -d "product-api" ]; then
          mvn -f product-api/pom.xml clean install -DskipTests
        else
          echo "product-api not found, skipping..."
        fi

        echo "Building payment-api..."
        if [ -d "payment-api" ]; then
          mvn -f payment-api/pom.xml clean install -DskipTests
        else
          echo "payment-api not found, skipping..."
        fi
        
        echo "Building order-api..."
        if [ -d "order-api" ]; then
          mvn -f order-api/pom.xml clean install -DskipTests
        else
          echo "order-api not found, skipping..."
        fi

    # 4. Build & Test từng service
    - name: Build Service with Maven
      run: |
        mvn -f ${{ matrix.service }}/pom.xml clean package -DskipTests

  # --- JOB: ĐẨY IMAGE LÊN DOCKER HUB ---
  docker-push:
    name: Docker Push - ${{ matrix.service }}
    needs: build-and-test
    # Chỉ chạy khi code được merge vào nhánh main (không chạy ở Pull Request)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: 
          - discovery-service
          - api-gateway
          - user-service
          - product-service
          - order-service
          - payment-service
          - cart-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cần cài Java để build file .jar trước khi đóng gói Docker
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Build Core Libraries (Cần thiết để build service jar)
      - name: Build Core Libraries
        run: |
          echo "Building core-common..."
          if [ -d "core-common" ]; then
            mvn -f core-common/pom.xml clean install -DskipTests
          fi
          
          echo "Building core-security..."
          if [ -d "core-security" ]; then
            mvn -f core-security/pom.xml clean install -DskipTests
          fi

          echo "Building product-service-grpc..."
          if [ -d "product-service-grpc" ]; then
            mvn -f product-service-grpc/pom.xml clean install -DskipTests
          fi

          # Also build API modules so the runner has the jars available (these will be copied into the image)
          echo "Building product-api..."
          if [ -d "product-api" ]; then
            mvn -f product-api/pom.xml clean install -DskipTests
          fi

          echo "Building payment-api..."
          if [ -d "payment-api" ]; then
            mvn -f payment-api/pom.xml clean install -DskipTests
          fi

          echo "Building order-api..."
          if [ -d "order-api" ]; then
            mvn -f order-api/pom.xml clean install -DskipTests
          fi

      # Build file .jar
      - name: Build Jar
        run: |
          mvn -f ${{ matrix.service }}/pom.xml clean package -DskipTests

      # Prepare a small runtime Dockerfile that uses the pre-built jar (avoids running Maven inside docker build)
      - name: Prepare runtime Dockerfile (use prebuilt jar)
        run: |
          cat > ./${{ matrix.service }}/Dockerfile.image <<'EOF'
          FROM eclipse-temurin:17-jre-alpine
          WORKDIR /app
          # copy the jar produced by the previous Build Jar step
          COPY ${{ matrix.service }}/target/*.jar app.jar
          ENTRYPOINT ["java","-jar","/app/app.jar"]
          EOF

      # Login vào Docker Hub (Dùng Secret đã cài đặt)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build và Push lên Docker Hub using the runtime Dockerfile that copies the prebuilt jar
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .                          # Đặt context tại gốc để tiếp cận target jar
          file: ./${{ matrix.service }}/Dockerfile.image # Use the generated runtime Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/axon-${{ matrix.service }}:latest
