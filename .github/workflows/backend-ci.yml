name: Backend Microservices CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: 
          - discovery-service
          - api-gateway
          - user-service
          - product-service
          - order-service
          - payment-service
          - cart-service

    steps:
    # 1. Lấy code từ Repo về
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Cài đặt Java 17 (Để tương thích tốt với Lombok & Spring Boot 3)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 3. Build & Test từng service
    - name: Build with Maven
      run: |
        cd ${{ matrix.service }}
        mvn clean package -DskipTests

  # --- JOB: ĐẨY IMAGE LÊN DOCKER HUB ---
  docker-push:
    name: Docker Push - ${{ matrix.service }}
    needs: build-and-test
    # Chỉ chạy khi code được merge vào nhánh main (không chạy ở Pull Request)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: 
          - discovery-service
          - api-gateway
          - user-service
          - product-service
          - order-service
          - payment-service
          - cart-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cần cài Java để build file .jar trước khi đóng gói Docker
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Build file .jar
      - name: Build Jar
        run: |
          cd ${{ matrix.service }}
          mvn clean package -DskipTests

      # Login vào Docker Hub (Dùng Secret đã cài đặt)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build và Push lên Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          # Đặt tên image: username/axon-service-name:latest
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/axon-${{ matrix.service }}:latest
