syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.productservicegrpc.grpc";
option java_outer_classname = "ProductServiceProto";

package product;

// ─── Request / Response ───

message GetProductByIdRequest {
  string product_id = 1;
}

message GetProductsByIdsRequest {
  repeated string product_ids = 1;
}

message ProductMessage {
  string product_id = 1;
  string name = 2;
  string price = 3;
  string image_url = 4;
}

message ProductResponse {
  bool found = 1;
  ProductMessage product = 2;
}

message ProductListResponse {
  repeated ProductMessage products = 1;
}

// ─── Service ───

service ProductGrpcService {
  rpc GetProductById (GetProductByIdRequest) returns (ProductResponse);
  rpc GetProductsByIds (GetProductsByIdsRequest) returns (ProductListResponse);
}