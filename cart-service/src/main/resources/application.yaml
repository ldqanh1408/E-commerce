server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: cart-service
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # password: ... (nếu có)


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true # Ưu tiên dùng IP thay vì Hostname trong Docker
