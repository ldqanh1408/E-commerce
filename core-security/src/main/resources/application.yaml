# Default configurations cho core-security module
# Các service có thể override trong application.yaml riêng của mình
core-security:
  public-paths:
    - /actuator/**
    - /api/v1/auth/**
  cors:
    allowed-origins:
      - "*"
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: false
