version: '3.8'

services:
  # ==========================================
  # 1. INFRASTRUCTURE (Hạ Tầng)
  # ==========================================

  # --- Axon Server (Event Store & Messaging Hub) ---
  axonserver:
    image: axoniq/axonserver:2023.2
    hostname: axonserver
    volumes:
      - axon-data:/axon-server-data
      - axon-events:/axon-server-eventstore
    ports:
      - "8024:8024" # Dashboard: http://localhost:8024
      - "8124:8124" # gRPC Port
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8024/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - axon-net

  # --- Databases (PostgreSQL - Database per Service) ---
  postgres-user:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - pg-user-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d user_db"]
      interval: 5s
      retries: 5
    networks:
      - axon-net

  postgres-product:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - pg-product-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d product_db"]
      interval: 5s
      retries: 5
    networks:
      - axon-net

  postgres-order:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - pg-order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d order_db"]
      interval: 5s
      retries: 5
    networks:
      - axon-net

  postgres-payment:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - pg-payment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d payment_db"]
      interval: 5s
      retries: 5
    networks:
      - axon-net

  # --- Redis (Cache & Cart) ---
  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    networks:
      - axon-net

  # ==========================================
  # 2. MICROSERVICES (Business Logic)
  # ==========================================

  user-service:
    build: ./user-service
    restart: on-failure
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/user_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      postgres-user:
        condition: service_healthy
    networks:
      - axon-net

  product-service:
    build: ./product-service
    restart: on-failure
    environment:
      SERVER_PORT: 8080
      # Kết nối Axon Server
      AXON_AXONSERVER_SERVERS: axonserver:8124
      # Kết nối DB View
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-product:5432/product_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      axonserver:
        condition: service_healthy
      postgres-product:
        condition: service_healthy
    networks:
      - axon-net

  order-service:
    build: ./order-service
    restart: on-failure
    environment:
      SERVER_PORT: 8080
      AXON_AXONSERVER_SERVERS: axonserver:8124
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/order_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      axonserver:
        condition: service_healthy
      postgres-order:
        condition: service_healthy
    networks:
      - axon-net

  payment-service:
    build: ./payment-service
    restart: on-failure
    environment:
      SERVER_PORT: 8080
      AXON_AXONSERVER_SERVERS: axonserver:8124
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payment:5432/payment_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      axonserver:
        condition: service_healthy
      postgres-payment:
        condition: service_healthy
    networks:
      - axon-net

  cart-service:
    build: ./cart-service
    restart: on-failure
    environment:
      SERVER_PORT: 8080
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - redis
    networks:
      - axon-net

  # ==========================================
  # 3. API GATEWAY (Spring Cloud Gateway)
  # ==========================================
  
  api-gateway:
    build: ./api-gateway
    restart: on-failure
    ports:
      - "80:8080" # Map cổng 80 của máy Host -> 8080 Gateway
    environment:
      SERVER_PORT: 8080
      # Cấu hình Routing động (hoặc qua application.yml)
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: user-service
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://user-service:8080
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/api/v1/users/**, /api/v1/auth/**
      
      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: product-service
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://product-service:8080
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: Path=/api/v1/products/**
      
      SPRING_CLOUD_GATEWAY_ROUTES_2_ID: order-service
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: http://order-service:8080
      SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0: Path=/api/v1/orders/**
      
      SPRING_CLOUD_GATEWAY_ROUTES_3_ID: payment-service
      SPRING_CLOUD_GATEWAY_ROUTES_3_URI: http://payment-service:8080
      SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0: Path=/api/v1/payments/**

      SPRING_CLOUD_GATEWAY_ROUTES_4_ID: cart-service
      SPRING_CLOUD_GATEWAY_ROUTES_4_URI: http://cart-service:8080
      SPRING_CLOUD_GATEWAY_ROUTES_4_PREDICATES_0: Path=/api/v1/cart/**
    depends_on:
      - user-service
      - product-service
      - order-service
      - payment-service
      - cart-service
    networks:
      - axon-net
    discovery-service:
    build: ./discovery-service
    ports:
      - "8761:8761"
    networks:
      - axon-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      retries: 5

  # Cập nhật các Service khác (Ví dụ User Service)
  user-service:
    # ...
    environment:
      # ... các biến cũ ...
      EUREKA_URI: http://discovery-service:8761/eureka # Trỏ vào container name
    depends_on:
      postgres-user:
        condition: service_healthy
      discovery-service: # Chờ Eureka lên trước
        condition: service_healthy

  # Cập nhật tương tự cho Product, Order, Payment, Cart, Gateway...
  # Nhớ thêm EUREKA_URI và depends_on: discovery-service

# ==========================================
# 4. VOLUMES & NETWORKS
# ==========================================
volumes:
  axon-data:
  axon-events:
  pg-user-data:
  pg-product-data:
  pg-order-data:
  pg-payment-data:
  redis-data:

networks:
  axon-net:
    driver: bridge