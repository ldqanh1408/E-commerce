services:
  # --- Discovery Service (Eureka) ---
  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    ports:
      - "${EUREKA_PORT}:8761"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axon-net

  # --- Axon Server ---
  axonserver:
    image: axoniq/axonserver:${AXON_IMAGE_TAG}
    hostname: axonserver
    environment:
      AXONIQ_AXONSERVER_DEVMODE_ENABLED: "true"
      AXONIQ_AXONSERVER_STANDALONE: "true"
      AXONIQ_AXONSERVER_HOSTNAME: axonserver
    volumes:
      - axon-data:/axon-server-data
      - axon-events:/axon-server-eventstore
    ports:
      - "${AXON_DASHBOARD_PORT}:8024"
      - "${AXON_GRPC_PORT}:8124"
    networks:
      - axon-net

  # --- Databases ---
  postgres-user:
    image: postgres:${POSTGRES_IMAGE_TAG}
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg-user-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${USER_DB_NAME}"]
      interval: 5s
      retries: 5
    networks:
      - axon-net

  postgres-product:
    image: postgres:${POSTGRES_IMAGE_TAG}
    environment:
      POSTGRES_DB: ${PRODUCT_DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg-product-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${PRODUCT_DB_NAME}"]
      interval: 5s
      retries: 5
    networks:
      - axon-net

  postgres-order:
    image: postgres:${POSTGRES_IMAGE_TAG}
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg-order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${ORDER_DB_NAME}"]
      interval: 5s
      retries: 5
    networks:
      - axon-net

  postgres-payment:
    image: postgres:${POSTGRES_IMAGE_TAG}
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg-payment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${PAYMENT_DB_NAME}"]
      interval: 5s
      retries: 5
    networks:
      - axon-net

  redis:
    image: redis:${REDIS_IMAGE_TAG}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    networks:
      - axon-net

  # --- Microservices ---
  user-service:
    build: ./user-service
    restart: on-failure
    environment:
      EUREKA_URI: http://discovery-service:8761/eureka
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/${USER_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres-user:
        condition: service_healthy
    networks:
      - axon-net

  product-service:
    build: ./product-service
    restart: on-failure
    environment:
      EUREKA_URI: http://discovery-service:8761/eureka
      SERVER_PORT: 8080
      AXON_AXONSERVER_SERVERS: axonserver:8124
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-product:5432/${PRODUCT_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      discovery-service:
        condition: service_healthy
      axonserver:
        condition: service_started
      postgres-product:
        condition: service_healthy
    networks:
      - axon-net

  order-service:
    build: ./order-service
    restart: on-failure
    environment:
      EUREKA_URI: http://discovery-service:8761/eureka
      SERVER_PORT: 8080
      AXON_AXONSERVER_SERVERS: axonserver:8124
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/${ORDER_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      discovery-service:
        condition: service_healthy
      axonserver:
        condition: service_started
      postgres-order:
        condition: service_healthy
    networks:
      - axon-net

  payment-service:
    build: ./payment-service
    restart: on-failure
    environment:
      EUREKA_URI: http://discovery-service:8761/eureka
      SERVER_PORT: 8080
      AXON_AXONSERVER_SERVERS: axonserver:8124
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payment:5432/${PAYMENT_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      discovery-service:
        condition: service_healthy
      axonserver:
        condition: service_started
      postgres-payment:
        condition: service_healthy
    networks:
      - axon-net

  cart-service:
    build: ./cart-service
    restart: on-failure
    environment:
      EUREKA_URI: http://discovery-service:8761/eureka
      SERVER_PORT: 8080
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - axon-net

  # --- API Gateway ---
  api-gateway:
    build: ./api-gateway
    restart: on-failure
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      EUREKA_URI: http://discovery-service:8761/eureka
      SERVER_PORT: 8080
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: user-service
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: lb://user-service
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/api/v1/users/**, /api/v1/auth/**
      
      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: product-service
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: lb://product-service
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: Path=/api/v1/products/**
      
      SPRING_CLOUD_GATEWAY_ROUTES_2_ID: order-service
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: lb://order-service
      SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0: Path=/api/v1/orders/**
      
      SPRING_CLOUD_GATEWAY_ROUTES_3_ID: payment-service
      SPRING_CLOUD_GATEWAY_ROUTES_3_URI: lb://payment-service
      SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0: Path=/api/v1/payments/**

      SPRING_CLOUD_GATEWAY_ROUTES_4_ID: cart-service
      SPRING_CLOUD_GATEWAY_ROUTES_4_URI: lb://cart-service
      SPRING_CLOUD_GATEWAY_ROUTES_4_PREDICATES_0: Path=/api/v1/cart/**
    depends_on:
      discovery-service:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      cart-service:
        condition: service_started
    networks:
      - axon-net

volumes:
  axon-data:
  axon-events:
  pg-user-data:
  pg-product-data:
  pg-order-data:
  pg-payment-data:
  redis-data:

networks:
  axon-net:
    driver: bridge