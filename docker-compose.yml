services:
  # ==========================================
  # 1. INFRASTRUCTURE (Hạ Tầng)
  # ==========================================

  # --- Axon Server (Event Store & Messaging Hub) ---
  axonserver:
    image: axoniq/axonserver:${AXON_IMAGE_TAG}
    environment:
      AXONIQ_AXONSERVER_DEVMODE_ENABLED: "true"
      AXONIQ_AXONSERVER_STANDALONE: "true"
      AXONIQ_AXONSERVER_HOSTNAME: axonserver
    volumes:
      - axon-data:/axon-server-data
      - axon-events:/axon-server-eventstore
    ports:
      - "8024:8024" # Dashboard: http://localhost:8024
      - "8124:8124" # gRPC Port
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8024/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - axon-net

  # --- Databases (PostgreSQL - Database per Service) ---
  postgres-user:
    image: postgres:${POSTGRES_IMAGE_TAG}
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg-user-data:/var/lib/postgresql/data
      - ./database/user-service/init.sql:/always-init/init.sql
    ports:
      - "${USER_DB_PORT}:5432"
    command: >
      bash -c "
        docker-entrypoint.sh postgres &
        until pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}; do sleep 1; done;
        echo 'Running init script for user-service...';
        PGPASSWORD=$${POSTGRES_PASSWORD} psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -f /always-init/init.sql || true;
        echo 'Init script completed.';
        wait
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${USER_DB_NAME}"]
      interval: 5s
      retries: 5
    networks:
      - axon-net

  postgres-product:
    image: postgres:${POSTGRES_IMAGE_TAG}
    environment:
      POSTGRES_DB: ${PRODUCT_DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg-product-data:/var/lib/postgresql/data
      - ./database/product-service/init.sql:/always-init/init.sql
    ports:
      - "${PRODUCT_DB_PORT}:5432"
    command: >
      bash -c "
        docker-entrypoint.sh postgres &
        until pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}; do sleep 1; done;
        echo 'Running init script for product-service...';
        PGPASSWORD=$${POSTGRES_PASSWORD} psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -f /always-init/init.sql || true;
        echo 'Init script completed.';
        wait
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${PRODUCT_DB_NAME}"]
      interval: 5s
      retries: 5
    networks:
      - axon-net

  postgres-order:
    image: postgres:${POSTGRES_IMAGE_TAG}
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg-order-data:/var/lib/postgresql/data
      - ./database/order-service/init.sql:/always-init/init.sql
    ports:
      - "${ORDER_DB_PORT}:5432"
    command: >
      bash -c "
        docker-entrypoint.sh postgres &
        until pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}; do sleep 1; done;
        echo 'Running init script for order-service...';
        PGPASSWORD=$${POSTGRES_PASSWORD} psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -f /always-init/init.sql || true;
        echo 'Init script completed.';
        wait
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${ORDER_DB_NAME}"]
      interval: 5s
      retries: 5
    networks:
      - axon-net

  postgres-payment:
    image: postgres:${POSTGRES_IMAGE_TAG}
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg-payment-data:/var/lib/postgresql/data
      - ./database/payment-service/init.sql:/always-init/init.sql
    ports:
      - "${PAYMENT_DB_PORT}:5432"
    command: >
      bash -c "
        docker-entrypoint.sh postgres &
        until pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}; do sleep 1; done;
        echo 'Running init script for payment-service...';
        PGPASSWORD=$${POSTGRES_PASSWORD} psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -f /always-init/init.sql || true;
        echo 'Init script completed.';
        wait
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${PAYMENT_DB_NAME}"]
      interval: 5s
      retries: 5
    networks:
      - axon-net

  redis:
    image: redis:${REDIS_IMAGE_TAG}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    networks:
      - axon-net

  # --- Microservices ---
  discovery-service:
    build:
      context: .
      dockerfile: ./discovery-service/Dockerfile
    restart: on-failure
    ports:
      - "${EUREKA_PORT}:8761"
    environment:
      SERVER_PORT: 8761
      JAVA_OPTS: "-Xmx256m -Xms256m"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axon-net

  user-service:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    restart: on-failure
    environment:
      EUREKA_URI: http://discovery-service:8761/eureka
      SERVER_PORT: 8080
      AXON_AXONSERVER_SERVERS: axonserver:8124
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/${USER_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    depends_on:
      discovery-service:
        condition: service_healthy
      axonserver:
        condition: service_healthy
      postgres-user:
        condition: service_healthy
    networks:
      - axon-net

  product-service:
    build:
      context: .
      dockerfile: ./product-service/Dockerfile
    restart: on-failure
    environment:
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      EUREKA_URI: http://discovery-service:8761/eureka
      SERVER_PORT: 8080
      AXON_AXONSERVER_SERVERS: axonserver:8124
      # Kết nối DB View
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-product:5432/${PRODUCT_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # Redis configuration
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # gRPC Server
      GRPC_SERVER_PORT: 9090
    depends_on:
      discovery-service:
        condition: service_healthy
      axonserver:
        condition: service_healthy
      postgres-product:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - axon-net

  order-service:
    build:
      context: .
      dockerfile: ./order-service/Dockerfile
    restart: on-failure
    environment:
      EUREKA_URI: http://discovery-service:8761/eureka
      SERVER_PORT: 8080
      AXON_AXONSERVER_SERVERS: axonserver:8124
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/${ORDER_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      discovery-service:
        condition: service_healthy
      axonserver:
        condition: service_healthy
      postgres-order:
        condition: service_healthy
    networks:
      - axon-net

  payment-service:
    build:
      context: .
      dockerfile: ./payment-service/Dockerfile
    restart: on-failure
    environment:
      EUREKA_URI: http://discovery-service:8761/eureka
      SERVER_PORT: 8080
      AXON_AXONSERVER_SERVERS: axonserver:8124
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payment:5432/${PAYMENT_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      discovery-service:
        condition: service_healthy
      axonserver:
        condition: service_healthy
      postgres-payment:
        condition: service_healthy
    networks:
      - axon-net

  cart-service:
    build:
      context: .
      dockerfile: ./cart-service/Dockerfile
    restart: on-failure
    environment:
      EUREKA_URI: http://discovery-service:8761/eureka
      SERVER_PORT: 8080
      AXON_AXONSERVER_SERVERS: axonserver:8124
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # gRPC Client → product-service
      GRPC_CLIENT_PRODUCT_SERVICE_ADDRESS: static://product-service:9090
    depends_on:
      discovery-service:
        condition: service_healthy
      axonserver:
        condition: service_healthy
      redis:
        condition: service_started
      product-service:
        condition: service_started
    networks:
      - axon-net

  # --- API Gateway ---
  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    restart: on-failure
    ports:
      - "${GATEWAY_PORT}:8080" # Map cổng Host -> Gateway
    environment:
      EUREKA_URI: http://discovery-service:8761/eureka
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      discovery-service:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      cart-service:
        condition: service_started
    networks:
      - axon-net

volumes:
  axon-data:
  axon-events:
  pg-user-data:
  pg-product-data:
  pg-order-data:
  pg-payment-data:
  redis-data:

networks:
  axon-net:
    driver: bridge